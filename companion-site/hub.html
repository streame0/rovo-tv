<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub Images</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0f">
</head>
<body>
  <div class="container" style="max-width:520px;">
    <div class="logo">
      <div class="logo-icon">&#127912;</div>
      <span class="logo-text">Hub Images</span>
    </div>
    <h1>Manage Images</h1>
    <p class="sub">Upload or remove custom images for each hub item on your TV</p>

    <p class="error" id="errorMsg"></p>
    <p class="link" id="countdown"></p>

    <div id="items-container">
      <div class="skeleton" style="height:60px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:60px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:60px;"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/session.js"></script>
  <script>
    const code = new URLSearchParams(window.location.search).get('code')
    if (!code) {
      document.getElementById('errorMsg').textContent = 'No session code'
      document.getElementById('errorMsg').classList.add('show')
      throw new Error('no code')
    }

    const container = document.getElementById('items-container')
    let sessionData = null

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.className = 'toast show' + (isError ? ' error' : '')
      setTimeout(() => el.classList.remove('show'), 3000)
    }

    async function init() {
      try {
        const session = await getSession(code)
        if (session.status === 'expired') {
          throw new Error('Session has expired. Please go back to the TV.')
        }
        sessionData = session.data
        if (session.expires_at) startCountdown(session.expires_at, 'countdown')
        renderItems(sessionData?.items || [])
      } catch (e) {
        container.innerHTML = `<p class="error show">${e.message}</p>`
      }

      subscribeToSession(code, (updated) => {
        if (updated.data?.items) {
          sessionData = updated.data
          renderItems(updated.data.items)
        }
      })
    }

    function renderItems(items) {
      if (!items || items.length === 0) {
        container.innerHTML = '<p class="link" style="padding:40px 0;">No items to manage</p>'
        return
      }

      const shape = sessionData?.shape || 'circle'
      const style = shape === 'circle' ? 'border-radius:50%;' : 'border-radius:8px;'

      let html = `<div class="header-stats"><span>${items.length} ${items.length === 1 ? 'item' : 'items'}</span></div><div class="items-grid">`
      for (const item of items) {
        const imgUrl = item.custom_image_url || ''
        const fallback = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2252%22 height=%2252%22><rect fill=%22%23222%22 width=%2252%22 height=%2252%22/><text x=%2226%22 y=%2232%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2220%22>?</text></svg>'
        html += `
          <div class="hub-item" data-id="${item.config_unique_id}">
            <img class="preview" src="${imgUrl || fallback}" style="${style}"
                 onerror="this.src='${fallback}'">
            <div class="info">
              <div class="title">${escapeHtml(item.title || 'Untitled')}</div>
              <div class="desc">${imgUrl ? 'Has custom image' : 'Default image'}</div>
            </div>
            <div class="actions">
              <input type="file" accept="image/*" class="file-input" data-id="${item.config_unique_id}">
              <button class="img-btn" data-id="${item.config_unique_id}">Upload</button>
              ${imgUrl ? `<button class="del-btn" data-id="${item.config_unique_id}">Delete</button>` : ''}
            </div>
          </div>`
      }
      html += '</div>'
      container.innerHTML = html

      container.querySelectorAll('.img-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.parentElement.querySelector('.file-input').click()
        })
      })

      container.querySelectorAll('.file-input').forEach(input => {
        input.addEventListener('change', (e) => {
          if (e.target.files[0]) uploadImage(e.target.dataset.id, e.target.files[0])
        })
      })

      container.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteImage(btn.dataset.id))
      })
    }

    async function uploadImage(configUniqueId, file) {
      showToast('Uploading...')
      try {
        const compressed = await compressImage(file, 1024, 0.8)
        const path = `hub-images/${code}/${configUniqueId}.png`
        const { error: uploadError } = await supabase.storage
          .from('hub-images')
          .upload(path, compressed, { upsert: true, contentType: 'image/webp' })
        if (uploadError) throw uploadError

        const { data: { publicUrl } } = supabase.storage.from('hub-images').getPublicUrl(path)

        const items = (sessionData.items || []).map(item => {
          if (item.config_unique_id === configUniqueId) {
            return { ...item, custom_image_url: publicUrl }
          }
          return item
        })

        await updateSession(code, { data: { ...sessionData, items } })
        sessionData = { ...sessionData, items }
        renderItems(items)
        showToast('Image uploaded! TV will update shortly.')
      } catch (e) {
        showToast('Upload failed: ' + e.message, true)
      }
    }

    async function deleteImage(configUniqueId) {
      showToast('Removing...')
      try {
        const path = `hub-images/${code}/${configUniqueId}.png`
        await supabase.storage.from('hub-images').remove([path])

        const items = (sessionData.items || []).map(item => {
          if (item.config_unique_id === configUniqueId) {
            return { ...item, custom_image_url: null }
          }
          return item
        })

        await updateSession(code, { data: { ...sessionData, items } })
        sessionData = { ...sessionData, items }
        renderItems(items)
        showToast('Image removed! TV will update shortly.')
      } catch (e) {
        showToast('Delete failed: ' + e.message, true)
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div')
      div.textContent = str
      return div.innerHTML
    }

    init()
  </script>
</body>
</html>

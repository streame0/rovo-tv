<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Upload Avatar</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <style>
    .avatar-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">&#128100;</div>
      <span class="logo-text">Upload Avatar</span>
    </div>

    <div id="upload-step" class="step active">
      <h1>Profile Picture</h1>
      <p class="sub">Choose a photo for your TV profile</p>
      <div class="upload-area" id="uploadArea">
        <div class="icon">&#128247;</div>
        <div class="text">Tap to select an image</div>
        <div class="hint">or drag and drop</div>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="crop-step" class="step">
      <h1>Adjust Your Photo</h1>
      <p class="sub">Drag to reposition, use the slider to zoom</p>
      <div class="crop-area" id="cropArea">
        <img class="crop-image" id="cropImage" draggable="false">
        <div class="crop-overlay"></div>
      </div>
      <span class="zoom-label">Zoom</span>
      <input type="range" class="zoom-slider" id="zoomSlider" min="50" max="300" step="1" value="150">
      <button id="doneBtn" class="primary">Save Avatar</button>
      <button class="secondary" onclick="goBack()">Choose Different Photo</button>
    </div>

    <div id="success-step" class="step" style="padding: 20px 0;">
      <div class="success-animation">
        <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" opacity="0.3"/>
          <path class="checkmark" d="M8 12l3 3 5-5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Avatar Uploaded!</h1>
      <p class="sub">Your profile picture has been updated. You can close this page now.</p>
    </div>

    <p class="error" id="errorMsg"></p>
    <p class="link" id="countdown"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/session.js"></script>
  <script>
    const code = new URLSearchParams(window.location.search).get('code')
    if (!code) {
      document.getElementById('errorMsg').textContent = 'No session code'
      document.getElementById('errorMsg').classList.add('show')
      throw new Error('no code')
    }

    getSession(code).then(s => {
      if (s.expires_at) startCountdown(s.expires_at, 'countdown')
    }).catch(() => {})

    const uploadStep = document.getElementById('upload-step')
    const cropStep = document.getElementById('crop-step')
    const successStep = document.getElementById('success-step')
    const uploadArea = document.getElementById('uploadArea')
    const fileInput = document.getElementById('fileInput')
    const cropImage = document.getElementById('cropImage')
    const zoomSlider = document.getElementById('zoomSlider')
    const doneBtn = document.getElementById('doneBtn')
    const errorMsg = document.getElementById('errorMsg')

    let scale = 1, minScale = 0.5, maxScale = 3, posX = 0, posY = 0
    let startX, startY, startPosX, startPosY, isDragging = false

    function goBack() {
      cropStep.classList.remove('active')
      uploadStep.classList.add('active')
    }

    uploadArea.addEventListener('click', () => fileInput.click())
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover') })
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'))
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault(); uploadArea.classList.remove('dragover')
      const file = e.dataTransfer.files[0]
      if (file && file.type.startsWith('image/')) loadImage(file)
    })
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) loadImage(e.target.files[0])
    })

    function loadImage(file) {
      if (file.size > 10 * 1024 * 1024) {
        errorMsg.textContent = 'Image is too large. Maximum size is 10 MB.'
        errorMsg.classList.add('show')
        return
      }
      errorMsg.classList.remove('show')
      const reader = new FileReader()
      reader.onload = (e) => {
        cropImage.onload = () => {
          const areaSize = 260
          const coverScale = Math.max(areaSize / cropImage.naturalWidth, areaSize / cropImage.naturalHeight)
          minScale = coverScale * 0.5; maxScale = coverScale * 3; scale = coverScale
          zoomSlider.min = minScale * 100; zoomSlider.max = maxScale * 100; zoomSlider.value = scale * 100
          const imgW = cropImage.naturalWidth * scale; const imgH = cropImage.naturalHeight * scale
          posX = (areaSize - imgW) / 2; posY = (areaSize - imgH) / 2
          updateTransform()
          uploadStep.classList.remove('active'); cropStep.classList.add('active')
        }
        cropImage.src = e.target.result
      }
      reader.readAsDataURL(file)
    }

    function updateTransform() {
      cropImage.style.width = (cropImage.naturalWidth * scale) + 'px'
      cropImage.style.height = (cropImage.naturalHeight * scale) + 'px'
      cropImage.style.left = posX + 'px'; cropImage.style.top = posY + 'px'
    }

    cropImage.addEventListener('mousedown', (e) => {
      isDragging = true; startX = e.clientX; startY = e.clientY
      startPosX = posX; startPosY = posY
    })
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return
      posX = startPosX + (e.clientX - startX); posY = startPosY + (e.clientY - startY)
      updateTransform()
    })
    document.addEventListener('mouseup', () => { isDragging = false })

    cropImage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY
        startPosX = posX; startPosY = posY
      }
    })
    cropImage.addEventListener('touchmove', (e) => {
      e.preventDefault()
      if (e.touches.length === 1 && isDragging) {
        posX = startPosX + (e.touches[0].clientX - startX)
        posY = startPosY + (e.touches[0].clientY - startY)
        updateTransform()
      }
    })
    cropImage.addEventListener('touchend', () => { isDragging = false })

    zoomSlider.addEventListener('input', (e) => {
      const oldScale = scale; scale = e.target.value / 100
      posX = (260/2) - (260/2 - posX) * (scale / oldScale)
      posY = (260/2) - (260/2 - posY) * (scale / oldScale)
      updateTransform()
    })

    doneBtn.addEventListener('click', async () => {
      doneBtn.disabled = true
      doneBtn.innerHTML = '<span class="spinner"></span>Uploading...'

      try {
        const canvas = document.createElement('canvas'); const size = 512
        canvas.width = size; canvas.height = size
        const ctx = canvas.getContext('2d')
        const cs = size / 260
        ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2); ctx.closePath(); ctx.clip()
        ctx.drawImage(cropImage, posX * cs, posY * cs, cropImage.naturalWidth * scale * cs, cropImage.naturalHeight * scale * cs)

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', 0.85))
        const path = `avatars/${code}.png`

        const { error: uploadError } = await supabase.storage.from('avatars').upload(path, blob, { upsert: true })
        if (uploadError) throw uploadError

        const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(path)

        await updateSession(code, { status: 'completed', data: { image_url: publicUrl } })

        cropStep.classList.remove('active'); successStep.classList.add('active')
      } catch (e) {
        errorMsg.textContent = 'Upload failed: ' + e.message
        errorMsg.classList.add('show')
        doneBtn.disabled = false
        doneBtn.innerHTML = 'Save Avatar'
      }
    })
  </script>
</body>
</html>
